name: ppu-810-build

on:
  pull_request:
    branches:
      - 'v2.18-SAIL'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: "pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.11.0-ubuntu24.04-cuda13.0-py312-20261001"
  NAMESPACE: "ppu-sched"
  NODE_SELECTOR: "board-type=OAM-810E"
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  ARTIFACT_SUBDIR: "te-ci/${{ github.run_id }}-${{ github.run_attempt }}"
  ARTIFACT_DIR: "/mnt/wl_nas/te-ci/${{ github.run_id }}-${{ github.run_attempt }}"
  TE_REPO: "https://github.com/flytiger-eco/TransformerEngine-for-sail.git"
  TE_REF: "${{ github.event.pull_request.head.sha || github.sha }}"
  PCCL_URL: "https://pkg.flytiger-eco.com/artifactory/generic-local/NCCL/v2.2.0/nccl-2.27.3-v13_ubuntu2404_sdk-v2.2.0.tar.gz"

  ENV_SETUP: |
    set -euo pipefail

    # PPU SDK
    SDK_INSTALL_DIR="${SDK_INSTALL_DIR:-/usr/local}"
    if [[ -f "${SDK_INSTALL_DIR}/PPU_SDK/envsetup.sh" ]]; then
      set +u; source "${SDK_INSTALL_DIR}/PPU_SDK/envsetup.sh"; set -u
    fi

    # PCCL (NCCL wrapper)
    PCCL_TARBALL="/tmp/$(basename "${PCCL_URL}")"
    wget -q -O "${PCCL_TARBALL}" "${PCCL_URL}"
    tar zxf "${PCCL_TARBALL}" -C /usr/local
    set +u; source /usr/local/pccl/envsetup.sh; set -u
    export CPATH="${NCCL_HOME}/include${CPATH:+:${CPATH}}"

  BUILD_COMMAND: |
    git init -q TransformerEngine-for-sail
    cd TransformerEngine-for-sail
    git remote add origin "${TE_REPO}"
    git fetch -q --depth=1 origin "${TE_REF}"
    git checkout -q FETCH_HEAD
    git submodule update --init --recursive

    pip3 install -U packaging==24.2 pybind11==3.1.0 nvidia-cudnn-frontend

    export NVTE_FRAMEWORK=pytorch
    export NVTE_WITH_NCCL_EP=0
    export NVTE_CUDA_ARCHS="80;89"
    export NVTE_BUILD_THREADS_PER_JOB=4
    export MAX_JOBS=60

    rm -rf "${ARTIFACT_DIR}"
    mkdir -p "${ARTIFACT_DIR}"

    SECONDS=0
    rc=0
    pip3 wheel -v --no-build-isolation --no-deps . -w "${ARTIFACT_DIR}" 2>&1 | tee ppu_build.log || rc=$?
    [[ "${rc}" -eq 0 ]] || exit "${rc}"

    git rev-parse HEAD > "${ARTIFACT_DIR}/commit"
    ls -lh "${ARTIFACT_DIR}"

  TEST_SETUP: |
    git init -q TransformerEngine-for-sail
    cd TransformerEngine-for-sail
    git remote add origin "${TE_REPO}"
    git fetch -q --depth=1 origin "$(cat "${ARTIFACT_DIR}/commit")"
    git checkout -q FETCH_HEAD

    pip3 install "${ARTIFACT_DIR}"/transformer_engine*.whl
    pip3 install nvdlfw_inspect pydantic onnxscript einops

    export TE_PATH="${PWD}"
    export XML_LOG_DIR="${PWD}/logs"

jobs:
  build:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: "编译 wheel (810E, 1 PPU)"
        id: build
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          nnodes: 0
          nproc_per_node: 1
          timeout_minutes: 60
          command: |
            ${{ env.ENV_SETUP }}
            ${{ env.BUILD_COMMAND }}
      - name: "上传 wheel"
        uses: actions/upload-artifact@v4
        with:
          name: transformer-engine-wheel
          path: /wl_nas/te-ci/${{ github.run_id }}-${{ github.run_attempt }}/*.whl
          if-no-files-found: error
          compression-level: 0