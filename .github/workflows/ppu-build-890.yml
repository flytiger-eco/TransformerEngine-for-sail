name: ppu-890-build

on:
  pull_request:
    branches:
      - 'v2.18-SAIL'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: "pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.11.0-ubuntu24.04-cuda13.0-py312-20261001"
  NAMESPACE: "ppu-sched"
  NODE_SELECTOR: "board-type=ZW-M890P"
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  ARTIFACT_SUBDIR: "te-ci/${{ github.run_id }}-${{ github.run_attempt }}"
  ARTIFACT_DIR: "/mnt/wl_nas/te-ci/${{ github.run_id }}-${{ github.run_attempt }}"
  TE_REPO: "https://github.com/flytiger-eco/TransformerEngine-for-sail.git"
  TE_REF: "${{ github.event.pull_request.head.sha || github.sha }}"
  PCCL_URL: "https://pkg.flytiger-eco.com/artifactory/generic-local/NCCL/v2.2.0/nccl-2.27.3-v13_ubuntu2404_sdk-v2.2.0.tar.gz"

  TEST_SETUP: |
    # 拉取与编译时相同 commit 的源码（仅用于测试脚本与用例），安装本 run 编译 step 产出的 wheel
    git init -q TransformerEngine-for-sail
    cd TransformerEngine-for-sail
    git remote add origin "${TE_REPO}"
    git fetch -q --depth=1 origin "$(cat "${ARTIFACT_DIR}/commit")"
    git checkout -q FETCH_HEAD

    # 镜像自带 packaging==21.3 过旧：安装 wheel 的依赖（如 cuda-bindings 走 sdist）时
    # setuptools 75.8 会调 canonicalize_version(strip_trailing_zero=...)，旧版无此参数直接崩溃。
    # 与构建侧保持一致，先升级 packaging。
    pip3 install -U packaging==24.2
    pip3 install "${ARTIFACT_DIR}"/transformer_engine*.whl
    pip3 install nvdlfw_inspect pydantic onnxscript einops psutil transformers scipy==1.18.1 pytest==8.2.1

    export TE_PATH="${PWD}"
    export XML_LOG_DIR="${PWD}/logs"
    mkdir -p "$XML_LOG_DIR"

  SMOKE_TEST: |
    set -x
    : ${NVTE_TEST_NVINSPECT_FEATURE_DIRS:=$TE_PATH/transformer_engine/debug/features}

    RET=0
    FAILED_CASES=""

    pytest -v -s $TE_PATH/tests/pytorch/debug/test_sanity.py --feature_dirs=$NVTE_TEST_NVINSPECT_FEATURE_DIRS || FAILED_CASES="$FAILED_CASES debug/test_sanity.py"
    pytest -v -s $TE_PATH/tests/pytorch/debug/test_config.py --feature_dirs=$NVTE_TEST_NVINSPECT_FEATURE_DIRS || FAILED_CASES="$FAILED_CASES debug/test_config.py"

    python3 -m pytest --tb=auto $TE_PATH/tests/pytorch/test_sanity.py || FAILED_CASES="$FAILED_CASES test_sanity.py"
    python3 -m pytest --tb=auto $TE_PATH/tests/pytorch/test_recipe.py || FAILED_CASES="$FAILED_CASES test_recipe.py"
    python3 -m pytest --tb=auto $TE_PATH/tests/pytorch/test_jit.py || FAILED_CASES="$FAILED_CASES test_jit.py"
    python3 -m pytest --tb=auto $TE_PATH/tests/pytorch/test_grouped_tensor.py || FAILED_CASES="$FAILED_CASES test_grouped_tensor.py"
    python3 -m pytest --tb=auto $TE_PATH/tests/pytorch/attention/test_attention.py || FAILED_CASES="$FAILED_CASES test_attention.py"
    NVTE_ALLOW_NONDETERMINISTIC_ALGO=0 python3 -m pytest --tb=auto $TE_PATH/tests/pytorch/attention/test_attention.py || FAILED_CASES="$FAILED_CASES NVTE_ALLOW_NONDETERMINISTIC_ALGO=0/test_attention.py"

    if [ -n "$FAILED_CASES" ]; then
      echo "Smoke test failed cases:$FAILED_CASES"
      RET=1
    else
      echo "All smoke tests passed"
    fi
    exit $RET

  ENV_SETUP: |
    set -euo pipefail

    # PPU SDK
    SDK_INSTALL_DIR="${SDK_INSTALL_DIR:-/usr/local}"
    if [[ -f "${SDK_INSTALL_DIR}/PPU_SDK/envsetup.sh" ]]; then
      set +u; source "${SDK_INSTALL_DIR}/PPU_SDK/envsetup.sh"; set -u
    fi

    PCCL_TARBALL="/tmp/$(basename "${PCCL_URL}")"
    wget -q -O "${PCCL_TARBALL}" "${PCCL_URL}"
    tar zxf "${PCCL_TARBALL}" -C /usr/local
    set +u; source /usr/local/pccl/envsetup.sh; set -u
    export CPATH="${NCCL_HOME}/include${CPATH:+:${CPATH}}"

  BUILD_COMMAND: |
    git init -q TransformerEngine-for-sail
    cd TransformerEngine-for-sail
    git remote add origin "${TE_REPO}"
    git fetch -q --depth=1 origin "${TE_REF}"
    git checkout -q FETCH_HEAD
    git submodule update --init --recursive

    pip3 install -U packaging==24.2 pybind11==3.1.0
    pip3 install nvidia-cudnn-frontend

    export NVTE_FRAMEWORK=pytorch
    export NVTE_WITH_NCCL_EP=0
    export NVTE_CUDA_ARCHS="80;89"
    export NVTE_BUILD_THREADS_PER_JOB=4
    export MAX_JOBS=60

    rm -rf "${ARTIFACT_DIR}"
    mkdir -p "${ARTIFACT_DIR}"

    SECONDS=0
    rc=0
    pip3 wheel -v --no-build-isolation --no-deps . -w "${ARTIFACT_DIR}" 2>&1 | tee ppu_build.log || rc=$?
    echo "[build] 编译耗时 ${SECONDS}s，退出码 ${rc}"
    [[ "${rc}" -eq 0 ]] || exit "${rc}"

    git rev-parse HEAD > "${ARTIFACT_DIR}/commit"
    ls -lh "${ARTIFACT_DIR}"

jobs:
  build:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: "编译 wheel (890P, 1 PPU)"
        id: build
        uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          nnodes: 0
          nproc_per_node: 1
          timeout_minutes: 120
          command: |
            ${{ env.ENV_SETUP }}
            ${{ env.BUILD_COMMAND }}
      - name: "上传 wheel"
        uses: actions/upload-artifact@v4
        with:
          name: transformer-engine-wheel
          path: /wl_nas/te-ci/${{ github.run_id }}-${{ github.run_attempt }}/*.whl
          if-no-files-found: error
          compression-level: 0

  # smoke 并入同一 workflow：pull_request 触发的普通 job，结果天然显示在 PR Checks。
  # schedule/workflow_dispatch 触发时也会跑（行为与原 workflow_run 消费链一致）。
  smoke:
    needs: build
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: "Smoke Test (890P, 1 PPU)"
        uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          nnodes: 0
          nproc_per_node: 1
          timeout_minutes: 120
          command: |
            ${{ env.ENV_SETUP }}
            ${{ env.TEST_SETUP }}
            ${{ env.SMOKE_TEST }}

  qwen-ep16:
    name: Qwen EP16 fused MegaMoE (2 nodes × 8 PPUs)
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-runner-group-cpu-flytiger
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    timeout-minutes: 100
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select MegaMoE changes
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE" ]] && git diff --quiet "$BASE...HEAD" -- \
              ':(glob)transformer_engine/**/*mega_moe*' transformer_engine/common/gemm \
              benchmarks/gemm/mega_moe_tags.py benchmarks/gemm/mega_moe_kernel_profile.py \
              benchmarks/gemm/replay_mega_moe.py qa/L0_pytorch_mega_moe_rtc \
              .github/workflows/ppu-build-890.yml .github/workflows/publish-mega-moe-report.yml; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
          else
            echo "selected=true" >> "$GITHUB_OUTPUT"
            base=$(git merge-base HEAD "${BASE:-origin/v2.18-SAIL}")
            cache="te-ci/rtc-grouped-gemm/wheels/cache-$base"
            if [[ $base == "$(git rev-parse HEAD)" ]]; then
              dir=$ARTIFACT_SUBDIR
            elif [[ -f /wl_nas/$cache/commit && $(cat "/wl_nas/$cache/commit") == "$base" ]] && compgen -G "/wl_nas/$cache/transformer_engine*.whl" > /dev/null; then
              dir=$cache
            else
              dir="$ARTIFACT_SUBDIR/merge-base-wheel"
              echo "build_base=true" >> "$GITHUB_OUTPUT"
            fi
            echo "base_sha=$base" >> "$GITHUB_OUTPUT"
            echo "base_dir=$dir" >> "$GITHUB_OUTPUT"
          fi
      - name: Build missing EP16 merge-base wheel
        if: steps.select.outputs.build_base == 'true'
        uses: flytiger-eco/shared-workflows/cluster-task@ff0ba437e1be55f5cecc51e4fde43c2908beaf56
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          nnodes: 0
          nproc_per_node: 1
          timeout_minutes: 90
          command: |
            ${{ env.ENV_SETUP }}
            export TE_REF='${{ steps.select.outputs.base_sha }}'
            export ARTIFACT_DIR='/mnt/wl_nas/${{ steps.select.outputs.base_dir }}'
            ${{ env.BUILD_COMMAND }}
      - name: Replay Qwen BF16 EP16 and verify kernels on every rank
        if: steps.select.outputs.selected == 'true'
        uses: flytiger-eco/shared-workflows/cluster-task@ff0ba437e1be55f5cecc51e4fde43c2908beaf56
        with:
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          rack_policy: same
          # PCCL needs access to the IMEX channel to allocate cross-node FABRIC memory.
          container_options: |
            privileged: true
          nnodes: 2
          nproc_per_node: 8
          timeout_minutes: 90
          command: |
            ${{ env.ENV_SETUP }}
            wheel_dir='${{ env.ARTIFACT_DIR }}'
            [[ $(cat "$wheel_dir/commit") == '${{ env.TE_REF }}' ]]
            bash "$SOURCE_DIR/qa/L0_pytorch_mega_moe_rtc/test_ep16.sh" "$wheel_dir" \
              '/mnt/wl_nas/${{ steps.select.outputs.base_dir }}' '${{ steps.select.outputs.base_sha }}'
      - name: Summarize EP16 replay timings
        if: steps.select.outputs.selected == 'true' && success()
        run: cat "/wl_nas/${{ env.ARTIFACT_SUBDIR }}/qwen-ep16/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - id: archive
        uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.selected == 'true'
        with:
          name: qwen-ep16-rank-paths
          path: /wl_nas/${{ env.ARTIFACT_SUBDIR }}/qwen-ep16/
          if-no-files-found: error

  publish-ep16:
    name: Publish Qwen EP16 comparison
    needs: qwen-ep16
    if: always() && !cancelled() && needs.qwen-ep16.outputs.artifact_id != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-mega-moe-report.yml
    with:
      report: ep16
      artifact_id: ${{ needs.qwen-ep16.outputs.artifact_id }}
      replay_result: ${{ needs.qwen-ep16.result }}
